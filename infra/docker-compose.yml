name: subsidy-rush

services:
  mysql:
    image: mysql:8.4
    container_name: subsidy-mysql
    ports:
      - "3306:3306"
    environment:
      # 비밀번호는 infra/.env에서 읽는다 (견본: infra/.env.example)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?infra/.env 필요}
      MYSQL_DATABASE: subsidy
      MYSQL_USER: subsidy
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?infra/.env 필요}
      MYSQLD_EXPORTER_PASSWORD: ${MYSQLD_EXPORTER_PASSWORD:?infra/.env 필요}  # init 스크립트용
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --local-infile=ON
      - --slow-query-log=ON
      - --long-query-time=0.2
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    container_name: subsidy-redis
    ports:
      - "6379:6379"
    # Phase 9 전까지 영속화 끔 (SPEC 2절)
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: subsidy-prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.20.0
    container_name: subsidy-mysqld-exporter
    ports:
      - "9104:9104"
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQLD_EXPORTER_PASSWORD:?infra/.env 필요}
    depends_on:
      mysql:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.93.0
    container_name: subsidy-redis-exporter
    ports:
      - "9121:9121"
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy

  # Docker Desktop(macOS)에서는 맥 본체가 아니라 Docker VM의 지표가 수집된다
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: subsidy-node-exporter
    ports:
      - "9100:9100"
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro

  grafana:
    image: grafana/grafana:13.2.4
    container_name: subsidy-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?infra/.env 필요}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mysql-data:
  prometheus-data:
  grafana-data:
