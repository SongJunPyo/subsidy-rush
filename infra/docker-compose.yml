name: subsidy-rush

services:
  mysql:
    image: mysql:8.4
    container_name: subsidy-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: subsidy
      MYSQL_USER: subsidy
      MYSQL_PASSWORD: subsidy
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --local-infile=ON
      - --slow-query-log=ON
      - --long-query-time=0.2
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    container_name: subsidy-redis
    ports:
      - "6379:6379"
    # Phase 9 전까지 영속화 끔 (SPEC 2절)
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
