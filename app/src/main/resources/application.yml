spring:
  application:
    name: subsidy-app
  profiles:
    default: local

server:
  port: 8080
  tomcat:
    mbeanregistry:
      enabled: true  # tomcat_threads_* 지표 노출 (Phase 7 스레드 고갈 관찰용)

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
